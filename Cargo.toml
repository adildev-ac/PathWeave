[package]
name = "netmerge-engine-prototype"
default-run = "netmerge-engine-prototype"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Windows-first TUN TCP interception and interface binding feasibility prototype"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ipstack = { path = "vendor/ipstack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tun = { version = "0.8", features = ["async"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1

